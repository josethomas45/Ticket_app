<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket App - Profile</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-color);
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .profile-details {
            text-align: left;
            width: 100%;
            margin-bottom: 25px;
            background: rgba(255,255,255,0.4);
            padding: 20px;
            border-radius: var(--border-radius-md);
        }
        .profile-details p {
            margin-bottom: 10px;
            font-size: 1rem;
            color: var(--text-main);
        }
        .profile-details strong {
            color: var(--primary-color);
            display: inline-block;
            width: 140px;
        }
    </style>
</head>
<body>
    <div class="center-wrapper">
        <div class="glass-panel">
            <div class="profile-header">
                <img id="profilePic" class="profile-pic" src="image/user.png" alt="Profile Picture">
                <h2>My Profile</h2>
            </div>
            
            <div class="profile-details">
                <p><strong>Username:</strong> <span id="username">JohnDoe</span></p>
                <p><strong>Address:</strong> <span id="address">123 Main St, Springfield</span></p>
                <p><strong>Email:</strong> <span id="email">johndoe@example.com</span></p>
                <p><strong>Phone:</strong> <span id="phone">123-456-7890</span></p>
                <p><strong>Wallet Balance:</strong> <span id="walletBalance" style="font-weight: 600; color: var(--secondary-color);">$50.00</span></p>
            </div>

            <button class="btn-primary" onclick="openModal('editModal')">Edit Profile</button>
            <button class="btn-success" onclick="openModal('rechargeModal')">Recharge Wallet</button>
            
            <div class="footer-text">
                <a href="home.html">&larr; Back to Dashboard</a>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('editModal')">&times;</span>
            <h2 style="margin-bottom: 20px;">Edit Profile</h2>
            <form id="editForm">
                <div class="form-group">
                    <label>Profile Picture</label>
                    <input type="file" id="profilePicInput" accept="image/*">
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="usernameInput" value="JohnDoe">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="emailInput" value="johndoe@example.com">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="phoneInput" value="123-456-7890">
                </div>
                <button type="submit" class="btn-primary">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- Recharge Modal -->
    <div class="modal-overlay" id="rechargeModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('rechargeModal')">&times;</span>
            <h2 style="margin-bottom: 20px;">Recharge Wallet</h2>
            <form id="rechargeForm">
                <div class="form-group">
                    <label>Amount to Recharge ($)</label>
                    <input type="number" id="rechargeAmount" step="0.01" min="1" required>
                </div>
                <button type="submit" class="btn-success">Confirm Recharge</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        document.getElementById('editForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const file = document.getElementById('profilePicInput').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = () => { document.getElementById('profilePic').src = reader.result; };
                reader.readAsDataURL(file);
            }
            document.getElementById('username').textContent = document.getElementById('usernameInput').value;
            document.getElementById('email').textContent = document.getElementById('emailInput').value;
            document.getElementById('phone').textContent = document.getElementById('phoneInput').value;
            closeModal('editModal');
        });

        document.getElementById('rechargeForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('rechargeAmount').value);
            if (amount > 0) {
                const walletEl = document.getElementById('walletBalance');
                let current = parseFloat(walletEl.textContent.replace('$', ''));
                walletEl.textContent = `$${(current + amount).toFixed(2)}`;
            }
            closeModal('rechargeModal');
        });
    </script>
</body>
</html>
