<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket App - Sign Up</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Background for signup */
        body {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.8), rgba(16, 185, 129, 0.8)), url('image/cinema-theater-ticket-template-set_1151483-49525.jpg') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <div class="center-wrapper">
        <div class="glass-panel">
            <h1>Create Account</h1>
            <p style="margin-bottom: 30px;">Join us to start booking</p>
            
            <div class="form-group">
                <label for="new-username">Username</label>
                <input type="text" id="new-username" placeholder="Choose a username">
            </div>
            
            <div class="form-group">
                <label for="new-password">Password</label>
                <input type="password" id="new-password" placeholder="Create a password">
            </div>
            
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Confirm your password">
            </div>
            
            <button class="btn-primary" onclick="signUp()">Sign Up</button>
            
            <div class="footer-text">
                Already have an account? <a href="index.html">Login here</a>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function signUp() {
            const username = document.getElementById('new-username').value;
            const password = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (username.trim() === '' || password.trim() === '' || confirmPassword.trim() === '') {
                alert('Please fill in all fields.');
            } else if (password !== confirmPassword) {
                alert('Passwords do not match.');
            } else {
                alert('Sign up successful!');
                navigateTo('index.html');
            }
        }
    </script>
</body>
</html>
