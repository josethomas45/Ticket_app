<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket App - Login</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Specific background for login if needed, or rely on global gradient */
        body {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.8), rgba(16, 185, 129, 0.8)), url('image/cinema-theater-ticket-template-set_1151483-49525.jpg') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <div class="center-wrapper">
        <div class="glass-panel">
            <h1>Welcome Back</h1>
            <p style="margin-bottom: 30px;">Please login to your account</p>
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>
            
            <button class="btn-primary" onclick="login()">Login</button>
            
            <div class="footer-text">
                Don't have an account? <a href="signup.html">Sign up here</a>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            if (username.trim() === '' || password.trim() === '') {
                alert('Please enter both username and password.');
            } else {
                navigateTo('home.html');
            }
        }
    </script>
</body>
</html>
