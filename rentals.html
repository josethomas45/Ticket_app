<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket App - Vehicle Rentals</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="center-wrapper">
        <div class="app-container">
            <h1 style="color: var(--primary-color); margin-bottom: 30px;">Vehicle Rentals</h1>
            <p style="margin-bottom: 40px; text-align: center;">Choose your preferred mode of transport</p>
            
            <div class="options-grid" style="max-width: 600px; margin: 0 auto;">
                <div class="glass-card" onclick="navigateTo('bikerent.html')">
                    <img src="image/motorbike.png" alt="Bike Rentals">
                    <h3>Bike Rentals</h3>
                    <p>Rent a bike for a quick city tour</p>
                </div>
                <div class="glass-card" onclick="navigateTo('carrent.html')">
                    <img src="image/car.png" alt="Car Rentals">
                    <h3>Car Rentals</h3>
                    <p>Rent a car for a comfortable trip</p>
                </div>
            </div>

            <div class="footer-text">
                <a href="home.html">&larr; Back to Dashboard</a>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
