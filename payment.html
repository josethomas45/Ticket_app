<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket App - Payment</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .order-summary {
            background: rgba(255,255,255,0.4);
            padding: 20px;
            border-radius: var(--border-radius-md);
            margin-bottom: 30px;
            text-align: left;
        }
        .order-summary p { margin-bottom: 8px; color: var(--text-main); }
        .payment-option-row {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.6);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: var(--border-radius-md);
            margin-bottom: 15px;
        }
        .payment-option-row img {
            width: 40px;
            height: 40px;
            margin-right: 15px;
            object-fit: contain;
        }
        .payment-option-details {
            flex-grow: 1;
            text-align: left;
        }
        .payment-option-details label {
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
        }
        .payment-option-details p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="center-wrapper">
        <div class="glass-panel" style="max-width: 600px;">
            <h1>Checkout</h1>
            <p style="margin-bottom: 25px;">Complete your payment securely</p>
            
            <div class="order-summary">
                <h3 style="margin-bottom: 15px;">Order Summary</h3>
                <p><strong>Booking Type:</strong> <span id="bookingType">General Booking</span></p>
                <p><strong>Total Amount:</strong> <span id="totalAmount" style="color: var(--primary-color); font-weight: 600; font-size: 1.1rem;">₹0.00</span></p>
            </div>

            <div class="payment-option-row">
                <img src="image/google-pay.png" alt="UPI">
                <div class="payment-option-details">
                    <label>UPI Payment</label>
                    <p>Fast and secure via your UPI app</p>
                </div>
                <button class="btn-primary" style="width: auto; padding: 10px 20px;" onclick="processPayment()">Pay</button>
            </div>

            <div class="payment-option-row">
                <img src="image/credit-card.png" alt="Card">
                <div class="payment-option-details">
                    <label>Credit/Debit Card</label>
                    <p>Visa, MasterCard, Amex supported</p>
                </div>
                <button class="btn-primary" style="width: auto; padding: 10px 20px;" onclick="processPayment()">Pay</button>
            </div>

            <div class="payment-option-row">
                <img src="image/wallet.png" alt="Wallet">
                <div class="payment-option-details">
                    <label>App Wallet</label>
                    <p>Available Balance: $50.00</p>
                </div>
                <button class="btn-primary" style="width: auto; padding: 10px 20px;" onclick="processPayment()">Pay</button>
            </div>
            
            <div class="footer-text">
                <button class="btn-secondary" onclick="window.history.back()">Cancel & Go Back</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const total = getQueryParam('total') || '0';
            const type = getQueryParam('type') || 'Bus / Transport Booking';
            
            // Format currency depending on context (using generic format here)
            document.getElementById('totalAmount').textContent = `$${parseFloat(total).toFixed(2)}`;
            document.getElementById('bookingType').textContent = type;
        });

        function processPayment() {
            alert('Processing Payment... Success!');
            navigateTo('home.html');
        }
    </script>
</body>
</html>
