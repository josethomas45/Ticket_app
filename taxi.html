<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket App - Taxi Booking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="center-wrapper">
        <div class="glass-panel" style="max-width: 500px;">
            <h1>Book a Taxi</h1>
            <p style="margin-bottom: 25px;">Fast and reliable rides</p>
            
            <div class="form-group">
                <label for="pickup">Pickup Location</label>
                <input type="text" id="pickup" placeholder="Enter pickup location">
            </div>
            <div class="form-group">
                <label for="destination">Destination</label>
                <input type="text" id="destination" placeholder="Enter destination">
            </div>
            
            <h3 style="margin-top: 25px; margin-bottom: 15px; font-size: 1.1rem; text-align: left;">Select Taxi Type</h3>
            
            <div class="taxi-options">
                <div class="selection-option" data-type="Standard" data-price="25">
                    Standard Taxi <span style="float:right; font-weight: 600;">$25</span>
                </div>
                <div class="selection-option" data-type="Premium" data-price="50">
                    Premium Taxi <span style="float:right; font-weight: 600;">$50</span>
                </div>
                <div class="selection-option" data-type="Luxury" data-price="100">
                    Luxury Taxi <span style="float:right; font-weight: 600;">$100</span>
                </div>
            </div>
            
            <button type="button" class="btn-primary" id="bookButton" style="margin-top: 15px;">Proceed to Payment</button>
            
            <div class="footer-text">
                <a href="home.html">&larr; Back to Dashboard</a>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const options = document.querySelectorAll('.selection-option');
        let selectedTaxi = null;

        options.forEach(opt => {
            opt.addEventListener('click', function() {
                options.forEach(o => o.classList.remove('selected'));
                this.classList.add('selected');
                selectedTaxi = this;
            });
        });

        document.getElementById('bookButton').addEventListener('click', function() {
            const pickup = document.getElementById('pickup').value;
            const destination = document.getElementById('destination').value;

            if (!pickup || !destination) {
                alert('Please enter both pickup and destination locations.');
                return;
            }
            if (!selectedTaxi) {
                alert('Please select a taxi type.');
                return;
            }

            const price = selectedTaxi.dataset.price;
            navigateTo(`payment.html?total=${price}&type=Taxi`);
        });
    </script>
</body>
</html>
