<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket App - Bus Booking</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .dropdown-container {
            display: none;
            margin-top: 25px;
            width: 100%;
        }
        iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: var(--border-radius-md);
            background: transparent;
        }
    </style>
</head>
<body>
    <div class="center-wrapper">
        <div class="glass-panel" style="max-width: 600px;">
            <h1>Bus Ticket Booking</h1>
            <p style="margin-bottom: 25px;">Enter details to find your bus</p>
            
            <form id="booking-form">
                <div class="form-group">
                    <label for="departure">Departure Location</label>
                    <input type="text" id="departure" name="departure" required placeholder="e.g. New York">
                </div>
                <div class="form-group">
                    <label for="arrival">Arrival Location</label>
                    <input type="text" id="arrival" name="arrival" required placeholder="e.g. Washington DC">
                </div>
                <div class="form-group">
                    <label for="passengers">Number of Passengers</label>
                    <input type="number" id="passengers" name="passengers" min="1" value="1" required>
                </div>
                
                <button type="submit" class="btn-primary">Find Seats</button>
            </form>

            <div class="dropdown-container" id="seat-selection-dropdown">
                <h3 style="margin-top: 30px; margin-bottom: 15px;">Select Your Seats</h3>
                <iframe id="seat-selection-frame" src=""></iframe>
            </div>

            <div class="footer-text">
                <a href="home.html">&larr; Back to Dashboard</a>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        document.getElementById('booking-form').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const departure = document.getElementById('departure').value;
            const arrival = document.getElementById('arrival').value;
            const passengers = parseInt(document.getElementById('passengers').value) || 1;

            const seatDropdown = document.getElementById('seat-selection-dropdown');
            seatDropdown.style.display = 'block';

            const seatFrame = document.getElementById('seat-selection-frame');
            seatFrame.src = `seats.html?maxSeats=${passengers}&departure=${encodeURIComponent(departure)}&arrival=${encodeURIComponent(arrival)}`;
        });
    </script>
</body>
</html>
