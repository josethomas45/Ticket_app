<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket App - Bike Rentals</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .car-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            width: 100%;
            margin-bottom: 50px;
        }
        .car-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: var(--border-radius-lg);
            overflow: hidden;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            transition: transform var(--transition-speed);
        }
        .car-card:hover {
            transform: translateY(-5px);
        }
        .car-img-container {
            width: 100%;
            height: 180px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .car-card img {
            max-width: 70%;
            max-height: 70%;
            object-fit: contain;
        }
        .car-details {
            padding: 20px;
            text-align: center;
        }
        .car-details h3 {
            color: var(--primary-color);
            font-size: 1.25rem;
        }
        .car-details p {
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <h1 style="color: var(--primary-color); margin-bottom: 10px;">Available Bikes for Rent</h1>
        <p style="margin-bottom: 40px; text-align: center;">Agile rides for quick city exploration</p>
        
        <div class="car-grid">
            <div class="car-card">
                <div class="car-img-container"><img src="image/motorbike.png" alt="Bike 1"></div>
                <div class="car-details">
                    <h3>City Scooter</h3>
                    <p>Perfect for zipping through traffic easily.</p>
                    <button class="btn-primary" onclick="rentVehicle('City Scooter', 25)">Rent for $25/day</button>
                </div>
            </div>
            <div class="car-card">
                <div class="car-img-container"><img src="image/motor sports.png" alt="Bike 2"></div>
                <div class="car-details">
                    <h3>Sports Bike</h3>
                    <p>High speed and great handling.</p>
                    <button class="btn-primary" onclick="rentVehicle('Sports Bike', 60)">Rent for $60/day</button>
                </div>
            </div>
            <div class="car-card">
                <div class="car-img-container"><img src="image/cruiser.png" alt="Bike 3"></div>
                <div class="car-details">
                    <h3>Cruiser</h3>
                    <p>Comfortable riding for long trips.</p>
                    <button class="btn-primary" onclick="rentVehicle('Cruiser', 50)">Rent for $50/day</button>
                </div>
            </div>
            <div class="car-card">
                <div class="car-img-container"><img src="image/dirt bike.png" alt="Bike 4"></div>
                <div class="car-details">
                    <h3>Dirt Bike</h3>
                    <p>For off-road adventures.</p>
                    <button class="btn-primary" onclick="rentVehicle('Dirt Bike', 40)">Rent for $40/day</button>
                </div>
            </div>
        </div>

        <div class="footer-text">
            <a href="rentals.html">&larr; Back to Rentals</a>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function rentVehicle(name, price) {
            if(confirm(`Rent ${name} for $${price}/day?`)) {
                navigateTo(`payment.html?total=${price}&type=${encodeURIComponent(name)}`);
            }
        }
    </script>
</body>
</html>
