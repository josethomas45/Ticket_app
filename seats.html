<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seat Selection</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Override body styles for iframe */
        body {
            background: transparent;
            min-height: auto;
            padding: 10px;
        }
        .bus-container {
            margin-top: 0;
            padding: 20px;
            width: 100%;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .legend-color {
            width: 20px; height: 20px; border-radius: 4px; margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="bus-container" id="busContainer">
        <div class="legend">
            <div class="legend-item"><div class="legend-color" style="background: #FCE7F3;"></div> Luxury</div>
            <div class="legend-item"><div class="legend-color" style="background: #E0F2FE;"></div> Economy</div>
            <div class="legend-item"><div class="legend-color" style="background: #DCFCE7;"></div> Sleeper</div>
            <div class="legend-item"><div class="legend-color" style="background: var(--primary-color);"></div> Selected</div>
        </div>
        
        <div id="seatsGrid">
            <!-- Seats injected here -->
        </div>
        
        <div style="margin-top: 25px; width: 100%; text-align: center;">
            <p id="selectionStatus" style="margin-bottom: 15px; font-weight: 500;">Please select seats.</p>
            <button type="button" class="btn-success" id="bookButton">Confirm Booking</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const seatTypes = [
            { type: 'luxury', icon: 'fa-couch', price: 1500 },
            { type: 'economy', icon: 'fa-chair', price: 600 },
            { type: 'sleeper', icon: 'fa-bed', price: 1000 }
        ];

        const luxurySeatCount = 12;
        const economySeatCount = 16;
        const sleeperSeatCount = 8;
        const rows = 9;
        const seatsPerRowLeft = 2;
        const seatsPerRowRight = 2;
        const totalSeats = luxurySeatCount + economySeatCount + sleeperSeatCount;

        const seatsGrid = document.getElementById('seatsGrid');
        const selectionStatus = document.getElementById('selectionStatus');

        let passengers = parseInt(getQueryParam('maxSeats')) || 1;
        selectionStatus.textContent = `Please select ${passengers} seat(s).`;

        for (let i = 0; i < rows; i++) {
            const row = document.createElement('div');
            row.className = 'seat-row';

            const leftSide = document.createElement('div');
            leftSide.className = 'seat-group';

            const rightSide = document.createElement('div');
            rightSide.className = 'seat-group';

            for (let j = 0; j < seatsPerRowLeft; j++) {
                createSeat(i * (seatsPerRowLeft + seatsPerRowRight) + j + 1, leftSide);
            }

            for (let j = 0; j < seatsPerRowRight; j++) {
                createSeat(i * (seatsPerRowLeft + seatsPerRowRight) + seatsPerRowLeft + j + 1, rightSide);
            }

            row.appendChild(leftSide);
            row.appendChild(rightSide);
            seatsGrid.appendChild(row);
        }

        function createSeat(seatNumber, container) {
            if (seatNumber > totalSeats) return;

            let seatType = seatNumber <= luxurySeatCount ? seatTypes[0] : 
                           seatNumber <= luxurySeatCount + economySeatCount ? seatTypes[1] : 
                           seatTypes[2];

            const seatBtn = document.createElement('div');
            seatBtn.className = `seat-btn ${seatType.type}`;
            seatBtn.dataset.price = seatType.price;
            
            // Randomly disable some seats for realism
            if(Math.random() < 0.2) {
                seatBtn.classList.add('disabled');
            }

            seatBtn.innerHTML = `
                <i class="fas ${seatType.icon}"></i>
                <div class="seat-price">₹${seatType.price}</div>
            `;

            seatBtn.addEventListener('click', function() {
                if (this.classList.contains('disabled')) return;

                const selected = document.querySelectorAll('.seat-btn.selected');
                if (this.classList.contains('selected')) {
                    this.classList.remove('selected');
                } else if (selected.length < passengers) {
                    this.classList.add('selected');
                } else {
                    alert(`You can only select ${passengers} seat(s).`);
                }
                updateStatus();
            });

            container.appendChild(seatBtn);
        }

        function updateStatus() {
            const selected = document.querySelectorAll('.seat-btn.selected').length;
            if(selected === passengers) {
                selectionStatus.textContent = `All ${passengers} seat(s) selected. Ready to confirm!`;
                selectionStatus.style.color = 'var(--secondary-color)';
            } else {
                selectionStatus.textContent = `Selected ${selected} of ${passengers} seat(s).`;
                selectionStatus.style.color = 'var(--text-main)';
            }
        }

        document.getElementById('bookButton').addEventListener('click', function() {
            const selectedSeats = document.querySelectorAll('.seat-btn.selected');
            if (selectedSeats.length !== passengers) {
                alert(`Please select exactly ${passengers} seat(s).`);
                return;
            }

            let totalAmount = 0;
            selectedSeats.forEach(seat => { totalAmount += parseFloat(seat.dataset.price); });

            window.parent.location.href = 'payment.html?total=' + totalAmount;
        });
    </script>
</body>
</html>
